version: "3.9"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apigateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # ── ML / Proxy services (internal only) ───────────────────────────────────
  ocr_api:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: uvicorn main:app --host 0.0.0.0 --port 8520
    volumes:
      - ./symbol_cnn_model.pt:/app/symbol_cnn_model.pt:ro
    restart: unless-stopped

  proxy_api:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: uvicorn openbudget_api:app --host 0.0.0.0 --port 8521
    volumes:
      - ./symbol_cnn_model.pt:/app/symbol_cnn_model.pt:ro
    restart: unless-stopped

  # ── Gateway (public API) ────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
    env_file: ./gateway/.env
    environment:
      OCR_API_URL: http://ocr_api:8520
      PROXY_API_URL: http://proxy_api:8521
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ocr_api:
        condition: service_started
      proxy_api:
        condition: service_started
    restart: unless-stopped

  # ── Seed (runs once) ────────────────────────────────────────────────────
  seed:
    build:
      context: ./gateway
    command: python scripts/seed.py
    env_file: ./gateway/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
